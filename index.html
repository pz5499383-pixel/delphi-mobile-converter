<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Converted App</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        h2 { color: #1b3b6f; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #2196f3;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { background-color: #0b7dda; }
        #result {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>My Mobile App</h2>
        <p>Enter data or text here (Desktop app alternative):</p>
        
        <input type="text" id="userInput" placeholder="Type something here...">
        <button onclick="runAction()">Run Action</button>
        
        <div id="result"></div>
    </div>

    <script>
        function runAction() {
            var text = document.getElementById("userInput").value;
            var resultDiv = document.getElementById("result");
            if(text.trim() === "") {
                resultDiv.innerHTML = "Please enter some text first!";
                resultDiv.style.color = "red";
            } else {
                resultDiv.innerHTML = "Success: " + text;
                resultDiv.style.color = "green";
            }
        }
    </script>

</body>
</html>
